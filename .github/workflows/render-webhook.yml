name: Render Webhook Alert
on:
  push:
    branches: [ "**" ] # Lắng nghe sự kiện push code ở mọi branch (cho github-feed)
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed] # PR_CLOSED/merged
  issue_comment:
    types: [created] # Comment tổng của CodeRabbit trên PR (summary)
  pull_request_review:
    types: [submitted] # Review tổng của CodeRabbit
  pull_request_review_comment:
    types: [created] # Comment CodeRabbit để lại trên 1 dòng code cụ thể
  check_run:
    types: [completed] # Lắng nghe khi các bước test/CI chạy xong

jobs:
  notify-render-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Send Data to Render Spring Boot
        env:
          RENDER_API_URL: "https://discord-bot-service-9m6f.onrender.com/api/webhook/coderabbit"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_FULL_NAME: ${{ github.repository }}

          # Dữ liệu từ PUSH
          PUSH_REF: ${{ github.ref_name }}
          PUSH_ACTOR: ${{ github.actor }}
          PUSH_COMPARE: ${{ github.event.compare }}

          # Fallback an toàn cho PR info
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title || github.event.check_run.pull_requests[0].title || '' }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url || '' }}

          COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}

          # Thông tin comment từng dòng code (pull_request_review_comment)
          RC_FILE_PATH: ${{ github.event.comment.path }}
          RC_LINE: ${{ github.event.comment.line || github.event.comment.original_line }}
          RC_COMMENT_URL: ${{ github.event.comment.html_url }}

          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}

          # Dữ liệu từ CI/Check Run
          CHECK_CONCLUSION: ${{ github.event.check_run.conclusion }}
          CHECK_NAME: ${{ github.event.check_run.name }}
          CHECK_URL: ${{ github.event.check_run.html_url }}
        run: |
          GITHUB_USERNAME=""
          SUMMARY=""
          ALERT_TYPE="UNKNOWN"
          SEVERITY="INFO"

          # 1. Xử lý sự kiện PUSH CODE
          if [[ "$EVENT_NAME" == "push" ]]; then
            ALERT_TYPE="PUSH"
            GITHUB_USERNAME="$PUSH_ACTOR"
            SUMMARY="Pushed to branch [$PUSH_REF]. Compare changes: $PUSH_COMPARE"

          # 2. Xử lý sự kiện PULL REQUEST
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            GITHUB_USERNAME="$PR_AUTHOR"
            SUMMARY="$PR_BODY"

            if [[ "$PR_ACTION" == "closed" ]]; then
              ALERT_TYPE="PR_CLOSED"
              if [[ "$PR_MERGED" == "true" ]]; then
                SUMMARY="[SUCCESS / MERGED] PR #$PR_NUMBER has been successfully merged."
              else
                SUMMARY="[CLOSED] PR #$PR_NUMBER was closed without merging."
              fi
            else
              ALERT_TYPE="PR_UPDATE"
            fi

          # 3. Xử lý sự kiện TRẠNG THÁI CI / TEST
          elif [[ "$EVENT_NAME" == "check_run" ]]; then
            GITHUB_USERNAME="GitHub Actions"
            ALERT_TYPE="CI_STATUS"
            SUMMARY="Workflow [ $CHECK_NAME ] status: ${CHECK_CONCLUSION^^}. Details: $CHECK_URL"

            if [[ "$CHECK_CONCLUSION" == "failure" ]]; then
              SEVERITY="HIGH"
            fi

          # 4. Xử lý COMMENT CỦA CODERABBIT TRÊN TỪNG DÒNG CODE
          elif [[ "$EVENT_NAME" == "pull_request_review_comment" ]]; then
            if [[ "$COMMENT_AUTHOR" != *"coderabbit"* ]]; then
              echo "Inline comment is not from CodeRabbit, skipping."
              exit 0
            fi
            ALERT_TYPE="CODERABBIT_LINE_COMMENT"
            GITHUB_USERNAME="$COMMENT_AUTHOR"
            SUMMARY="$COMMENT_BODY"

            if [[ "$SUMMARY" == *"Critical"* ]]; then
              SEVERITY="HIGH"
            elif [[ "$SUMMARY" == *"Major"* ]]; then
              SEVERITY="MEDIUM"
            elif [[ "$SUMMARY" == *"Minor"* ]]; then
              SEVERITY="LOW"
            fi

          # 5. Xử lý COMMENT/REVIEW TỔNG CỦA CODERABBIT TRÊN CẢ PR
          elif [[ "$COMMENT_AUTHOR" == *"coderabbit"* ]]; then
            ALERT_TYPE="CODERABBIT_REVIEW"
            GITHUB_USERNAME="$COMMENT_AUTHOR"
            SUMMARY="$COMMENT_BODY"

            if [[ "$SUMMARY" == *"fail"* ]] || [[ "$SUMMARY" == *"error"* ]]; then
              SEVERITY="HIGH"
            fi
          else
            echo "Event not mapped to any alert channel. Skipping."
            exit 0
          fi

          echo "Processing event: $ALERT_TYPE triggered by $GITHUB_USERNAME"

          # Lấy danh sách file thay đổi
          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" && "$PR_NUMBER" != "0" && "$ALERT_TYPE" != "CODERABBIT_LINE_COMMENT" ]]; then
            CHANGED_FILES_JSON=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/files?per_page=100" \
              | jq '[.[].filename]')
          else
            CHANGED_FILES_JSON="[]"
            PR_NUMBER="${PR_NUMBER:-0}"
          fi

          if [[ -z "$CHANGED_FILES_JSON" ]] || ! echo "$CHANGED_FILES_JSON" | jq -e 'type == "array"' > /dev/null 2>&1; then
            CHANGED_FILES_JSON="[]"
          fi

          # Gửi nguyên vẹn chuỗi SUMMARY qua jq --arg để đảm bảo an toàn dữ liệu cho Backend bóc tách
          jq -n \
            --arg repoFullName "$REPO_FULL_NAME" \
            --argjson prNumber "${PR_NUMBER:-0}" \
            --arg prTitle "$PR_TITLE" \
            --arg prUrl "$PR_URL" \
            --arg githubUsername "$GITHUB_USERNAME" \
            --arg alertType "$ALERT_TYPE" \
            --arg severity "$SEVERITY" \
            --arg summary "$SUMMARY" \
            --argjson changedFiles "$CHANGED_FILES_JSON" \
            --arg filePath "${RC_FILE_PATH:-}" \
            --argjson lineNumber "${RC_LINE:-null}" \
            --arg commentUrl "${RC_COMMENT_URL:-}" \
            '{
              repoFullName: $repoFullName,
              prNumber: $prNumber,
              prTitle: $prTitle,
              prUrl: $prUrl,
              githubUsername: $githubUsername,
              alertType: $alertType,
              severity: $severity,
              summary: $summary,
              changedFiles: $changedFiles,
              filePath: (if $filePath == "" then null else $filePath end),
              lineNumber: $lineNumber,
              commentUrl: (if $commentUrl == "" then null else $commentUrl end)
            }' > payload.json

          echo "Sending payload to $RENDER_API_URL..."
          curl -H "Content-Type: application/json" \
               -X POST \
               --data @payload.json \
               "$RENDER_API_URL"
