name: Notify CodeRabbit Line Comment
on:
  pull_request_review_comment:
    types: [created]
jobs:
  notify-line-comment:
    # Bắt tất cả username có chứa từ coderabbit (bao gồm coderabbitai[bot])
    if: contains(github.event.comment.user.login, 'coderabbit')
    runs-on: ubuntu-latest
    steps:
      - name: Send Line Comment Payload to Backend
        env:
          RENDER_API_URL: "https://discord-bot-service-9m6f.onrender.com/api/webhook/coderabbit"
          # Truyền các biến text qua env để GitHub Actions tự escaping an toàn
          COMMENT_BODY: ${{ github.event.comment.body }}
          FILE_PATH: ${{ github.event.comment.path }}
          LINE_NUMBER: ${{ github.event.comment.line }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_USERNAME: ${{ github.event.comment.user.login }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          # FIX: severity trước đó bị hardcode cứng "HIGH" cho MỌI comment, nên
          # nitpick nhỏ và lỗi Critical đều hiện đỏ như nhau, mất khả năng phân biệt.
          # Khôi phục lại cách dò severity theo đúng chữ CodeRabbit tự in trong nội
          # dung comment ("... | Critical | ...", "... | Major | ...", "... | Minor | ...").
          SEVERITY="INFO"
          if [[ "$COMMENT_BODY" == *"Critical"* ]]; then
            SEVERITY="HIGH"
          elif [[ "$COMMENT_BODY" == *"Major"* ]]; then
            SEVERITY="MEDIUM"
          elif [[ "$COMMENT_BODY" == *"Minor"* ]]; then
            SEVERITY="LOW"
          fi

          jq -n \
            --arg repoFullName "$REPO_FULL_NAME" \
            --argjson prNumber "${PR_NUMBER:-0}" \
            --arg prTitle "$PR_TITLE" \
            --arg prUrl "$PR_URL" \
            --arg githubUsername "$GITHUB_USERNAME" \
            --arg alertType "CODERABBIT_LINE_COMMENT" \
            --arg severity "$SEVERITY" \
            --arg summary "$COMMENT_BODY" \
            --arg filePath "$FILE_PATH" \
            --argjson lineNumber "${LINE_NUMBER:-null}" \
            --arg commentUrl "$COMMENT_URL" \
            '{
              repoFullName: $repoFullName,
              prNumber: $prNumber,
              prTitle: $prTitle,
              prUrl: $prUrl,
              githubUsername: $githubUsername,
              alertType: $alertType,
              severity: $severity,
              summary: $summary,
              filePath: $filePath,
              lineNumber: $lineNumber,
              commentUrl: $commentUrl
            }' > payload.json
          echo "Sending line comment to $RENDER_API_URL..."
          curl -H "Content-Type: application/json" \
               -X POST \
               --data @payload.json \
               "$RENDER_API_URL"
